[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "viper"
dynamic = ["version"]
description = "viper: o arsenal — funções nascidas de problemas do estudo, importáveis como as nativas"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Jared" }]
keywords = ["arsenal", "functions", "data analysis", "cli"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Natural Language :: Portuguese (Brazilian)",
]

[project.scripts]
viper = "viper_cli.cli:main"

[project.urls]
Repositorio = "https://github.com/GF-Linux/viper"

[tool.setuptools.dynamic]
version = { attr = "viper.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
